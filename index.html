<!doctype html>
<html lang="pt-BR" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snitap | Patins para uma vida mais radical</title>
    <meta
      name="description"
      content="Snitap: patins que deixam a sua vida mais radical, divertida e saudável. Conheça a galeria #usesnitap e compre o seu."
    />
    <meta name="theme-color" content="#fafafa" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Snitap | Patins para uma vida mais radical" />
    <meta
      property="og:description"
      content="Patins que deixam a sua vida mais radical, divertida e saudável."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Montserrat:wght@500&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />

    <script>
      document.documentElement.classList.replace('no-js', 'js');
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <div class="scroll-progress" aria-hidden="true"></div>

    <header class="header" data-header data-intro>
      <div class="container header__inner">
        <a class="logo" href="#topo" aria-label="Snitap, voltar ao início">
          <img src="./src/assets/icons/logo-fill.svg" width="32" height="32" alt="" />
        </a>

        <button class="cart-button" type="button" data-cart aria-label="Carrinho: 1 item">
          <img src="./src/assets/icons/shopping-bag-lg.svg" width="32" height="32" alt="" />
          <span class="cart-button__count" data-cart-count aria-hidden="true">1</span>
        </button>
      </div>
    </header>

    <main id="conteudo">
      <!-- Hero -->
      <section class="hero" id="topo" aria-labelledby="hero-title" data-intro>
        <div class="container hero__inner">
          <div class="hero__main">
            <h1
              class="hero__title"
              id="hero-title"
              aria-label="Snitap, sua vida mais radical, divertida e saudável"
            >
              <span class="hero__line" aria-hidden="true"
                ><span class="hero__line-inner">Snitap, sua vida</span></span
              >
              <span class="hero__line" aria-hidden="true"
                ><span class="hero__line-inner"
                  >mais
                  <span class="word-rotator" data-word-rotator>
                    <span class="word-rotator__track">
                      <span class="word-rotator__word" style="--word-color: var(--color-cyan)"
                        >radical</span
                      >
                      <span class="word-rotator__word" style="--word-color: var(--color-pink)"
                        >divertida</span
                      >
                      <span class="word-rotator__word" style="--word-color: var(--color-green)"
                        >saudável</span
                      >
                    </span>
                  </span></span
                ></span
              >
            </h1>

            <div class="hero__actions">
              <button class="button button--primary" type="button" data-add-to-cart data-magnetic>
                <span class="button__shine" aria-hidden="true"></span>
                <img src="./src/assets/icons/shopping-bag.svg" width="24" height="24" alt="" />
                <span>Comprar agora</span>
              </button>

              <a class="video-button" href="#galeria" data-magnetic>
                <span class="video-button__icon">
                  <img src="./src/assets/icons/play.svg" width="24" height="24" alt="" />
                </span>
                <span>Veja em ação</span>
              </a>
            </div>
          </div>

          <div class="hero__image" data-hero-image>
            <img
              class="hero__ellipse"
              src="./src/assets/images/ellipse.svg"
              width="462"
              height="462"
              alt=""
            />
            <div class="hero__patins-wrapper" data-patins>
              <img
                class="hero__patins"
                src="./src/assets/images/patins.webp"
                width="488"
                height="462"
                alt="Patins Snitap bege com rodas cor de pêssego"
                fetchpriority="high"
              />
            </div>
            <img
              class="hero__stars hero__stars--2"
              src="./src/assets/images/stars-2.svg"
              width="40"
              height="60"
              alt=""
            />
            <img
              class="hero__stars hero__stars--1"
              src="./src/assets/images/stars-1.svg"
              width="88"
              height="72"
              alt=""
            />
          </div>
        </div>
      </section>

      <!-- Faixa -->
      <div class="marquee" aria-hidden="true">
        <div class="marquee__band">
          <div class="marquee__track" data-marquee>
            <div class="marquee__group">
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
              <span class="marquee__item">Patins</span>
              <img class="marquee__star" src="./src/assets/icons/star.svg" alt="" />
            </div>
          </div>
        </div>
      </div>

      <!-- Galeria -->
      <section class="gallery" id="galeria" aria-labelledby="gallery-title">
        <div class="container">
          <header class="gallery__heading">
            <p class="gallery__eyebrow" data-reveal>Galeria de fotos</p>
            <h2 class="gallery__title" id="gallery-title" data-reveal>#usesnitap por aí</h2>
          </header>

          <div class="gallery__grid">
            <div class="gallery__row" data-gallery-row>
              <figure class="photo-card photo-card--narrow" tabindex="0">
                <div class="photo-card__media">
                  <img
                    src="./src/assets/images/gallery-lavinia.webp"
                    width="976"
                    height="801"
                    alt="Patinadora fazendo pose com uma perna erguida em uma quadra ao ar livre"
                    loading="lazy"
                  />
                </div>
                <figcaption class="photo-card__info">
                  <img src="./src/assets/images/insta-avatar.webp" width="32" height="32" alt="" />
                  <span>@laviniapereira</span>
                </figcaption>
              </figure>

              <figure class="photo-card photo-card--wide" tabindex="0">
                <div class="photo-card__media">
                  <img
                    src="./src/assets/images/gallery-lucas.webp"
                    width="1393"
                    height="801"
                    alt="Grupo de amigos andando de patins em uma rua arborizada de um parque"
                    loading="lazy"
                  />
                </div>
                <figcaption class="photo-card__info">
                  <img src="./src/assets/images/insta-avatar.webp" width="32" height="32" alt="" />
                  <span>@lucasantos</span>
                </figcaption>
              </figure>
            </div>

            <div class="gallery__row" data-gallery-row>
              <figure class="photo-card photo-card--wide" tabindex="0">
                <div class="photo-card__media">
                  <img
                    src="./src/assets/images/gallery-theresa.webp"
                    width="1393"
                    height="800"
                    alt="Pessoa amarrando os cadarços de um par de patins brancos ao lado de um tênis azul"
                    loading="lazy"
                  />
                </div>
                <figcaption class="photo-card__info">
                  <img src="./src/assets/images/insta-avatar.webp" width="32" height="32" alt="" />
                  <span>@theresacomt</span>
                </figcaption>
              </figure>

              <figure class="photo-card photo-card--narrow" tabindex="0">
                <div class="photo-card__media">
                  <img
                    src="./src/assets/images/gallery-carol.webp"
                    width="976"
                    height="800"
                    alt="Pernas de uma patinadora de calça rosa em uma quadra ao pôr do sol"
                    loading="lazy"
                  />
                </div>
                <figcaption class="photo-card__info">
                  <img src="./src/assets/images/insta-avatar.webp" width="32" height="32" alt="" />
                  <span>@carolzinha__</span>
                </figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__inner" data-footer>
        <a class="footer__logo" href="#topo">
          <img src="./src/assets/icons/logo-fill.svg" width="32" height="32" alt="" />
          <span>Snitap</span>
        </a>

        <nav class="footer__menu" aria-label="Rodapé">
          <a class="link" href="#">Sobre</a>
          <a class="link" href="#">Nossas lojas</a>
          <a class="link" href="#">Política de privacidade</a>
        </nav>

        <ul class="footer__social" aria-label="Redes sociais">
          <li>
            <a class="social-button" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              <img src="./src/assets/icons/instagram.svg" width="24" height="24" alt="" />
            </a>
          </li>
          <li>
            <a class="social-button" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              <img src="./src/assets/icons/facebook.svg" width="24" height="24" alt="" />
            </a>
          </li>
          <li>
            <a class="social-button" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
              <img src="./src/assets/icons/youtube.svg" width="24" height="24" alt="" />
            </a>
          </li>
          <li>
            <a class="social-button" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
              <img src="./src/assets/icons/tiktok.svg" width="24" height="24" alt="" />
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <div class="toast" role="status" aria-live="polite" data-toast></div>
  </body>
</html>
